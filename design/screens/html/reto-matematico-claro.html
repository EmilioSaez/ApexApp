<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Apex - Reto Matemático</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#B93E00",
            "primary-container": "#FFDBCB",
            "on-primary": "#FFFFFF",
            "on-primary-container": "#361000",
            "surface": "#F8F9FA",
            "surface-container": "#EEF0F2",
            "surface-container-high": "#E2E5E8",
            "on-surface": "#1A1C1E",
            "on-surface-variant": "#44474F",
            "outline": "#74777F",
            "outline-variant": "#C4C7C5",
            "error": "#B3261E",
            "error-container": "#F9DEDC",
            "on-error-container": "#410E0B",
            "background": "#F8F9FA",
            "on-background": "#1A1C1E"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          fontFamily: {
            "headline": ["Sora", "sans-serif"],
            "display": ["Sora", "sans-serif"],
            "body": ["Inter", "sans-serif"],
            "label": ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col justify-between selection:bg-primary/20">
<!-- TopAppBar (from JSON spec, adjusted for light mode context) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-4 h-14 bg-surface border-b border-outline-variant/20">
<div class="flex items-center gap-3">
<button aria-label="Volver" class="w-10 h-10 flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline text-xl font-black uppercase tracking-wider text-primary">APEX</span>
</div>
<div class="flex items-center gap-2">
<span class="font-headline text-xs font-bold text-on-surface-variant uppercase tracking-wider bg-surface-container px-2.5 py-1">Reto 1 de 3</span>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-4 pt-20 pb-28 max-w-md mx-auto w-full">
<div class="w-full flex flex-col items-center gap-8">
<!-- Instruction header -->
<div class="text-center space-y-1">
<h1 class="font-headline text-sm font-semibold tracking-wide text-on-surface-variant uppercase">Resuelve para desactivar</h1>
<p class="font-body text-xs text-outline">Intento 2 de 3 antes de activar alarma sonora</p>
</div>
<!-- Mathematical Operation -->
<div class="py-6 px-8 bg-surface-container w-full text-center border-l-4 border-primary">
<span class="font-display text-5xl md:text-6xl font-extrabold tracking-tight text-on-surface">
          47 + 38 = <span class="text-primary">?</span>
</span>
</div>
<!-- Input Field with Error -->
<div class="w-full space-y-2">
<div class="relative">
<input class="w-full h-16 px-4 text-center font-display text-2xl font-bold bg-surface border-2 border-error text-error tracking-widest focus:outline-none" placeholder="---" readonly="" type="text" value="84"/>
</div>
<div class="flex items-center gap-1.5 text-error px-1">
<span class="material-symbols-outlined text-sm">error</span>
<span class="font-body text-xs font-semibold">Respuesta incorrecta</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary font-headline font-bold text-sm tracking-wider uppercase flex items-center justify-center hover:bg-primary/90 transition-colors active:scale-95 shadow-none">
        COMPROBAR RESPUESTA
      </button>
</div>
</main>
<!-- On-Screen Numeric Keypad -->
<footer class="fixed bottom-0 left-0 w-full z-40 bg-surface-container border-t border-outline-variant/20 p-3">
<div class="max-w-md mx-auto grid grid-cols-3 gap-2">
<button class="h-14 bg-surface hover:bg-surface-container-high text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">1</button>
<button class="h-14 bg-surface hover:bg-surface-container-high text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">2</button>
<button class="h-14 bg-surface hover:bg-surface-container-high text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">3</button>
<button class="h-14 bg-surface hover:bg-surface-container-high text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">4</button>
<button class="h-14 bg-surface hover:bg-surface-container-high text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">5</button>
<button class="h-14 bg-surface hover:bg-surface-container-high text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">6</button>
<button class="h-14 bg-surface hover:bg-surface-container-high text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">7</button>
<button class="h-14 bg-surface hover:bg-surface-container-high text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">8</button>
<button class="h-14 bg-surface hover:bg-surface-container-high text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">9</button>
<button class="h-14 bg-surface-container-high hover:bg-surface-container-high/80 text-on-surface-variant font-headline font-semibold text-sm flex items-center justify-center transition-colors active:scale-95">C</button>
<button class="h-14 bg-surface hover:bg-surface-container-high text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">0</button>
<button class="h-14 bg-surface-container-high hover:bg-surface-container-high/80 text-on-surface font-headline font-bold text-xl flex items-center justify-center transition-colors active:scale-95">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
</footer>
</body></html>
