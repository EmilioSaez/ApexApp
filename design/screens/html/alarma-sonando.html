<!-- Interfaz de Alarma Inevitable: Sin navegación estándar (Bloqueada por reto activo) -->
<!-- 1. Cabecera Superior: Indicador sutil de audio -->
<header class="w-full pt-4 pb-2 px-6 flex items-center justify-between z-10 shrink-0">
<div class="flex items-center gap-2.5">
<div class="relative flex items-center justify-center w-2.5 h-2.5">

<span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-primary"></span>
</div>
<span class="text-xs font-label uppercase tracking-wider text-on-surface-variant font-medium">Alarma sonando</span>
</div>
<div class="flex items-center gap-1.5 text-on-surface-variant">

</div>
</header>
<!-- 2. Bloque Horario y Contextual -->
<section class="w-full px-6 pt-1 pb-4 text-center shrink-0">
<h1 class="font-display font-extrabold text-6xl tracking-tight text-on-surface tabular-nums leading-none">
      06:45
    </h1>
<p class="font-label text-xs text-on-surface-variant tracking-normal mt-2.5 font-medium">
      Despertar laboral · Martes
    </p>
</section>
<!-- 3. Sección Central del Reto (El Protagonista) -->
<main class="w-full px-6 flex-1 flex flex-col justify-center max-w-md mx-auto"><div class="w-full flex flex-col items-center justify-center py-8"><button class="w-full py-4 bg-primary text-on-primary font-headline font-bold text-lg rounded-lg hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button"><span class="material-symbols-outlined text-2xl">play_arrow</span><span>Iniciar reto obligatorio</span></button><p class="text-xs font-label text-outline mt-4 text-center">La alarma continuará hasta completar los pasos requeridos.</p></div></main>
<!-- 4. Teclado Numérico Ergonómico Táctil (Bottom Half) -->
<!-- Lógica ligera para interacción del teclado -->
<script>
    let currentInput = "85";
    const inputElement = document.getElementById("user-input");

    function updateDisplay() {
      inputElement.textContent = currentInput;
    }

    function appendDigit(digit) {
      if (currentInput.length < 4) {
        currentInput += digit;
        updateDisplay();
      }
    }

    function deleteDigit() {
      if (currentInput.length > 0) {
        currentInput = currentInput.slice(0, -1);
        updateDisplay();
      }
    }

    function submitAnswer() {
      // 47 + 38 = 85
      if (currentInput === "85") {
        inputElement.classList.remove("text-primary");
        inputElement.classList.add("text-[#5BD68A]");
        setTimeout(() => {
          // Feedback de éxito sutil antes de avanzar al siguiente reto
          inputElement.classList.remove("text-[#5BD68A]");
          inputElement.classList.add("text-primary");
        }, 600);
      } else {
        inputElement.classList.remove("text-primary");
        inputElement.classList.add("text-[#FF6B6B]");
        setTimeout(() => {
          inputElement.classList.remove("text-[#FF6B6B]");
          inputElement.classList.add("text-primary");
          currentInput = "";
          updateDisplay();
        }, 400);
      }
    }
  </script>
