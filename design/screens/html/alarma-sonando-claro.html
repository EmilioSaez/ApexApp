<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Apex - Alarma Sonando</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#F8F9FA",
            background: "#F8F9FA",
            "on-surface": "#111827",
            "on-surface-variant": "#4B5563",
            primary: "#B93E00",
            "on-primary": "#FFFFFF",
            "surface-container": "#FFFFFF",
            "outline": "#D1D5DB"
          },
          borderRadius: {
            DEFAULT: "4px",
            lg: "4px",
            xl: "4px",
            full: "9999px"
          },
          fontFamily: {
            headline: ["Sora", "sans-serif"],
            display: ["Sora", "sans-serif"],
            body: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col justify-between selection:bg-primary selection:text-white">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 h-14 bg-surface border-b border-outline/20">
<div class="font-headline text-xl font-black uppercase tracking-wider text-primary">
      Apex
    </div>
<div class="flex items-center gap-2 text-on-surface-variant text-sm font-medium">
<span class="material-symbols-outlined text-lg">volume_up</span>
<span>Volumen max</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-6 pt-20 pb-12 max-w-md mx-auto w-full text-center">
<div class="w-full bg-surface-container border border-outline/30 p-8 rounded-[4px] flex flex-col items-center justify-center">
<!-- Alarm Time -->
<div class="font-headline text-8xl font-extrabold tracking-tight text-on-surface leading-[1.0] mb-4 tabular-nums">
        07:30
      </div>
<!-- Alarm Label -->
<div class="font-body text-xl font-medium text-on-surface-variant mb-12">
        Trabajo
      </div>
<!-- Primary Action Button -->
<button class="w-full py-5 px-6 bg-primary text-on-primary font-headline font-bold text-base rounded-[4px] hover:opacity-90 active:scale-[0.99] transition-all flex items-center justify-center gap-3">
<span>Resolver reto para apagar</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<!-- Footer status -->
<footer class="w-full py-4 text-center text-xs text-on-surface-variant font-body border-t border-outline/20">
    Despertador activo - Reto obligatorio requerido
  </footer>
</body></html>
