<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<title>ApexApp · Memoria de cuadrícula · observar</title>
<link rel="stylesheet" href="apex-tokens.css">
<link rel="stylesheet" href="apex-ui.css">
</head>
<body>
<div class="screen" style="min-height: 800px">
<header class="ring-head">
  <div class="ring-status"><span class="dot" aria-hidden="true"></span><span class="lbl t-label-m">Alarma sonando</span><span class="vol t-label-m"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>80%</span></div>
  <div class="t-display-m" style="color: var(--on-surface); margin-top: 8px">06:30</div>
  <div class="t-body-l muted">Gimnasio</div>
</header>
<main class="session">
<div class="session-top">
  <div class="progress-row"><span class="t-label-l" style="color: var(--on-surface)">Reto 1 de 1</span><span class="t-label-l muted">Memoria de cuadrícula</span></div>
  <div class="segments" aria-hidden="true"><span class="on"></span></div>
</div>
<div class="prompt"><span class="t-title-m" style="color: var(--on-surface)">Memoriza la secuencia</span><span class="t-body-m muted">Paso 3 de 5 · no toques todavía</span></div>
<div class="grid" style="width: 304px; grid-template-columns: repeat(3, minmax(0, 1fr))"><button class="cell" aria-label="Casilla 1"></button><button class="cell" aria-label="Casilla 2"></button><button class="cell" aria-label="Casilla 3"></button><button class="cell" aria-label="Casilla 4"></button><button class="cell" aria-label="Casilla 5"></button><button class="cell lit" aria-label="Casilla 6, iluminada"></button><button class="cell" aria-label="Casilla 7"></button><button class="cell" aria-label="Casilla 8"></button><button class="cell" aria-label="Casilla 9"></button></div>
<div class="steps" aria-hidden="true"><span class="on"></span><span class="on"></span><span class="now"></span><span class=""></span><span class=""></span></div>
</main>
<div class="bottom"><button class="btn-outline"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><circle cx="12" cy="13" r="7.5"/><path d="M9.5 10.5h5l-5 5h5M4 4.5 6.5 2.5M20 4.5l-2.5-2"/></svg>Posponer 5 min · quedan 2</button></div>
</div>
</body>
</html>
