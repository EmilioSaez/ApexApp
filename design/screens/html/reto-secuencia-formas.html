<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<title>ApexApp · Secuencia de formas · responder</title>
<link rel="stylesheet" href="apex-tokens.css">
<link rel="stylesheet" href="apex-ui.css">
</head>
<body>
<div class="screen" style="min-height: 800px">
<header class="ring-head">
  <div class="ring-status"><span class="dot" aria-hidden="true"></span><span class="lbl t-label-m">Alarma sonando</span><span class="vol t-label-m"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>80%</span></div>
  <div class="t-display-m" style="color: var(--on-surface); margin-top: 8px">06:30</div>
  <div class="t-body-l muted">Gimnasio</div>
</header>
<main class="session">
<div class="session-top">
  <div class="progress-row"><span class="t-label-l" style="color: var(--on-surface)">Reto 1 de 2</span><span class="t-label-l muted">Secuencia de formas</span></div>
  <div class="segments" aria-hidden="true"><span class="on"></span><span class=""></span></div>
</div>
<div class="prompt"><span class="t-title-m" style="color: var(--on-surface)">Repite la secuencia</span><span class="t-body-m muted">2 de 5</span></div>
<div style="display: flex; flex-direction: column; gap: 4px">
  <div class="slots" aria-label="Tu secuencia"><div class="slot"><svg viewBox="0 0 48 48" width="28" height="28" role="img" aria-label="Triángulo"><polygon class="shape" points="24,5 44,41 4,41"/></svg></div><div class="slot"><svg viewBox="0 0 48 48" width="28" height="28" role="img" aria-label="Círculo"><circle class="shape" cx="24" cy="24" r="18"/></svg></div><div class="slot next" aria-label="Siguiente"></div><div class="slot empty"></div><div class="slot empty"></div></div>
  <button class="btn-text" style="align-self: flex-end; color: var(--on-surface)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 7H9l-6 5 6 5h12z"/><path d="M12 10l4 4M16 10l-4 4"/></svg>Borrar última</button>
</div>
<div class="palette"><button class="pal" aria-label="Círculo"><svg viewBox="0 0 48 48" width="36" height="36" role="img" aria-label="Círculo"><circle class="shape" cx="24" cy="24" r="18"/></svg><span class="nm">Círculo</span></button><button class="pal" aria-label="Cuadrado"><svg viewBox="0 0 48 48" width="36" height="36" role="img" aria-label="Cuadrado"><rect class="shape" x="7" y="7" width="34" height="34"/></svg><span class="nm">Cuadrado</span></button><button class="pal" aria-label="Triángulo"><svg viewBox="0 0 48 48" width="36" height="36" role="img" aria-label="Triángulo"><polygon class="shape" points="24,5 44,41 4,41"/></svg><span class="nm">Triángulo</span></button><button class="pal" aria-label="Rombo"><svg viewBox="0 0 48 48" width="36" height="36" role="img" aria-label="Rombo"><polygon class="shape" points="24,3 45,24 24,45 3,24"/></svg><span class="nm">Rombo</span></button><button class="pal" aria-label="Cruz"><svg viewBox="0 0 48 48" width="36" height="36" role="img" aria-label="Cruz"><polygon class="shape" points="18,5 30,5 30,18 43,18 43,30 30,30 30,43 18,43 18,30 5,30 5,18 18,18"/></svg><span class="nm">Cruz</span></button><button class="pal" aria-label="Hexágono"><svg viewBox="0 0 48 48" width="36" height="36" role="img" aria-label="Hexágono"><polygon class="shape" points="24,4 41.3,14 41.3,34 24,44 6.7,34 6.7,14"/></svg><span class="nm">Hexágono</span></button></div>
</main>
<div class="bottom"><button class="btn-outline"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><circle cx="12" cy="13" r="7.5"/><path d="M9.5 10.5h5l-5 5h5M4 4.5 6.5 2.5M20 4.5l-2.5-2"/></svg>Posponer 5 min · quedan 2</button></div>
</div>
</body>
</html>
