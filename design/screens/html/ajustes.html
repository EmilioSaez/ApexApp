<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Apex — Ajustes</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      font-size: 20px;
      line-height: 1;
      display: inline-block;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Tabular figures for technical readout */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    /* Hide scrollbar for technical sleek look */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0c0e12;
    }
    ::-webkit-scrollbar-thumb {
      background: #202631;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body antialiased min-h-screen pb-24 selection:bg-primary-container selection:text-on-primary">
<!-- TopAppBar: Sub-Page Header (Task-focused configuration) -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-4 h-14 bg-surface border-b border-outline-variant/20">
<div class="flex items-center gap-3">
<button aria-label="Volver atrás" class="h-10 w-10 flex items-center justify-center rounded text-on-surface hover:bg-surface-variant/40 active:opacity-80 active:scale-95 duration-100 transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col">
<span class="font-headline text-sm font-bold tracking-widest uppercase text-on-surface">AJUSTES</span>
<span class="text-[10px] tracking-wider text-outline font-label uppercase">CONFIGURACIÓN DEL SISTEMA</span>
</div>
</div>
<div class="flex items-center gap-1">
<div class="h-2 w-2 rounded-full bg-primary animate-pulse mr-1"></div>
<span class="font-headline text-xs font-bold text-on-surface-variant tracking-wider">APEX-SYS</span>
</div>
</header>
<!-- Main Settings Layout -->
<main class="pt-16 max-w-2xl mx-auto px-4 md:px-6"><section class="mt-4">
<div class="pb-2 mb-2 border-b border-outline-variant/20">
<h2 class="font-headline text-xs font-bold tracking-widest text-primary uppercase">01 // Apariencia</h2>
</div>
<div class="py-4 border-b border-outline-variant/15 flex items-center justify-between">
<span class="text-sm font-medium text-on-surface">Tema claro</span>
<button class="w-5 h-5 rounded-full border border-outline-variant/50 flex items-center justify-center" type="button"></button>
</div>
<div class="py-4 border-b border-outline-variant/15 flex items-center justify-between">
<span class="text-sm font-medium text-on-surface">Tema oscuro</span>
<div class="w-5 h-5 rounded-full bg-primary flex items-center justify-center"><span class="w-2 h-2 rounded-full bg-background"></span></div>
</div>
<div class="py-4 border-b border-outline-variant/15 flex items-center justify-between">
<span class="text-sm font-medium text-on-surface">Sistema</span>
<button class="w-5 h-5 rounded-full border border-outline-variant/50 flex items-center justify-center" type="button"></button>
</div>
</section>
<section class="mt-8">
<div class="pb-2 mb-2 border-b border-outline-variant/20">
<h2 class="font-headline text-xs font-bold tracking-widest text-primary uppercase">02 // Idioma y Región</h2>
</div>
<div class="py-4 border-b border-outline-variant/15 flex items-center justify-between">
<span class="text-sm font-medium text-on-surface">Español</span>
<div class="w-5 h-5 rounded-full bg-primary flex items-center justify-center"><span class="w-2 h-2 rounded-full bg-background"></span></div>
</div>
<div class="py-4 border-b border-outline-variant/15 flex items-center justify-between">
<span class="text-sm font-medium text-on-surface">Inglés</span>
<button class="w-5 h-5 rounded-full border border-outline-variant/50 flex items-center justify-center" type="button"></button>
</div>
<div class="py-4 border-b border-outline-variant/15 flex items-center justify-between">
<span class="text-sm font-medium text-on-surface">Sistema</span>
<button class="w-5 h-5 rounded-full border border-outline-variant/50 flex items-center justify-center" type="button"></button>
</div>
</section>
<section class="mt-8 mb-12">
<div class="pb-2 mb-2 border-b border-outline-variant/20">
<h2 class="font-headline text-xs font-bold tracking-widest text-primary uppercase">03 // Más Secciones</h2>
</div>
<div class="py-4 border-b border-outline-variant/15 flex items-center justify-between text-outline">
<span class="text-sm font-medium text-on-surface-variant">Futuras expansiones y módulos</span>
<span class="text-xs font-mono">DISPONIBLE PRONTO</span>
</div>
</section></main>
<!-- BottomNavBar: Fixed Ecosystem Navigation -->
<!-- Note: Shared Components contract dictates: ['Alarmas', 'Retos', 'Historial'] -->
<!-- As this is an internal settings view mapped from the primary shell, the navigation is anchored in flat no shadow design -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex items-center justify-around px-4 h-16 bg-surface-container border-t border-outline-variant/20">
<!-- Tab: Alarmas -->
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-on-surface transition-colors p-1 active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="alarm">alarm</span>
<span class="font-body text-xs font-medium">Alarmas</span>
</a>
<!-- Tab: Retos -->
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-on-surface transition-colors p-1 active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="psychology">psychology</span>
<span class="font-body text-xs font-medium">Retos</span>
</a>
<!-- Tab: Historial -->
<a class="flex flex-col items-center justify-center gap-1 text-on-surface-variant hover:text-on-surface transition-colors p-1 active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-body text-xs font-medium">Historial</span>
</a>
</nav>
</body></html>
