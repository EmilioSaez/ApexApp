<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<title>ApexApp · Alarma sonando · sin posposiciones</title>
<link rel="stylesheet" href="apex-tokens.css">
<link rel="stylesheet" href="apex-ui.css">
</head>
<body>
<div class="screen" style="min-height: 800px">
<div style="flex: 1; display: flex; flex-direction: column; padding: 16px 20px">
  <div class="ring-status"><span class="dot" aria-hidden="true"></span><span class="lbl t-label-m">Alarma sonando</span><span class="vol t-label-m"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>80%</span></div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 24px">
    <div class="t-display-l" style="color: var(--on-surface)">06:45</div>
    <div class="t-body-l muted">Gimnasio</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 48px">
    <div class="note" style="background: var(--surface-container-low); border: 1px solid var(--outline-variant); color: var(--on-surface); align-items: center; min-height: 56px; padding: 12px 16px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><circle cx="12" cy="13" r="7.5"/><path d="M9.5 10.5h5l-5 5h5M4 4.5 6.5 2.5M20 4.5l-2.5-2"/></svg><div style="display: flex; flex-direction: column"><span class="t-title-m">Sin posposiciones</span><span class="t-body-m muted">Ya la has pospuesto 3 de 3 veces.</span></div></div>
    <button class="btn-primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Apagar</button>
  </div>
</div>
</div>
</body>
</html>
